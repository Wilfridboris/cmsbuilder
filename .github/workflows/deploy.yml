name: Deploy

# Vercel preview (on PR) + production (on push to main) deploys.
#
# This workflow activates only once a human links the Vercel project and sets
# the required repository secrets (see README.md → "Manual external-account
# steps"). Until those secrets exist the deploy steps are skipped, so the
# workflow never fails a build on a fresh clone.
#
# Required repository secrets:
#   VERCEL_TOKEN      - Vercel access token
#   VERCEL_ORG_ID     - from `vercel link` (.vercel/project.json)
#   VERCEL_PROJECT_ID - from `vercel link` (.vercel/project.json)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Vercel deploy
    runs-on: ubuntu-latest
    # Skip entirely until the Vercel token secret is configured by a human.
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — only run when Vercel is linked
        id: guard
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "Vercel not linked yet (VERCEL_TOKEN missing); skipping deploy."
            echo "linked=false" >> "$GITHUB_OUTPUT"
          else
            echo "linked=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.linked == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Vercel CLI
        if: steps.guard.outputs.linked == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (preview)
        if: steps.guard.outputs.linked == 'true' && github.event_name == 'pull_request'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build & deploy preview
        if: steps.guard.outputs.linked == 'true' && github.event_name == 'pull_request'
        run: |
          vercel build --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Pull Vercel environment (production)
        if: steps.guard.outputs.linked == 'true' && github.event_name == 'push'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build & deploy production
        if: steps.guard.outputs.linked == 'true' && github.event_name == 'push'
        run: |
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
