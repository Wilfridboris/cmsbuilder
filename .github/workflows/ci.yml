name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (includes service-role-key + hardcoded-string gates)
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test

      # ---------------------------------------------------------------------
      # RLS isolation test (Story 1.2) — DISABLED for the MVP go-live.
      #
      # This integration test seeds AND deletes orgs/users in a real hosted
      # Supabase project. For MVP we promoted the single existing project to
      # PRODUCTION (no separate test project), so running it here would mutate
      # and delete rows in the production database on every CI run. It is
      # disabled to keep CI non-destructive against prod.
      #
      # To re-enable later: stand up a dedicated throwaway Supabase project,
      # point the SUPABASE_TEST_* GitHub secrets at THAT project (never prod),
      # and restore the step below. Also remove any SUPABASE_TEST_* secrets that
      # currently point at the production project so nothing can run it against
      # prod in the meantime.
      #
      # - name: RLS isolation (integration, real Supabase)
      #   run: npm run test:rls
      #   env:
      #     SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      #     SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      #     SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
      # ---------------------------------------------------------------------
