name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (includes service-role-key + hardcoded-string gates)
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test

      # ---------------------------------------------------------------------
      # RLS isolation test (Story 1.2) — HARD CI gate. Runs against a real
      # (hosted) Supabase test project: a member of Org A can read Org A's
      # records; a stranger cannot read them and cannot insert into Org A.
      #
      # Credentials come from GitHub repository secrets (see README §Supabase
      # test project). Until the human sets them, the test self-skips; once set,
      # it is enforced. This step fails the build on any isolation regression.
      # ---------------------------------------------------------------------
      - name: RLS isolation (integration, real Supabase)
        run: npm run test:rls
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
